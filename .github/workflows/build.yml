name: Build

on:
  workflow_call:
    inputs:
      image_tags:
        description: The image tags, space-separated, without the variant suffix; empty pushes the images by digest only
        required: false
        type: string
        default: ''
      docker:
        description: Build and push the images
        required: false
        type: boolean
        default: true
      binaries:
        description: Build the binaries, installers, AppImage and Flatpak
        required: false
        type: boolean
        default: true
      ref:
        description: The commit the images are built from; empty builds the one the workflow runs on
        required: false
        type: string
        default: ''
      legacy:
        description: Also tag the images in the legacy namespace
        required: false
        type: boolean
        default: true
    secrets:
      GHCR_LEGACY_TOKEN:
        required: false

env:
  GO_VERSION: '1.27.4'
  GO_SHA256_LINUX_AMD64: '7226736c2339719cda28fbf3a54d71aa63bcefe376e98cef00034268dab24840'
  GO_SHA256_LINUX_ARM64: '3392582988a273a87ab5043ee1b2c9c17a2c3c00580bf9326c47a2e0aaaeac92'
  MONWORKER_VERSION: '1.0.2'
  MONWORKER_SHA256_LINUX_AMD64: '473520805cf5f28bea3883cbe9d2d5749fe2612d69299942162ee3cd5a291200'
  MONWORKER_SHA256_LINUX_ARM64: 'e3623311399b897c5ef1a7d74b8ab088ac3c0f6bfb0d80757d6a50d5421a3e17'
  MONWORKER_SHA256_WINDOWS_AMD64: '3f3978f883fea7d24c5b66dbdbc8bbaddf6474fb2dc75588546235cf673e1497'
  FFMPEG_BUILD: 'v8.1.3-mb4'
  FFMPEG_NAME: 'ffmpeg-8.1.3-mb4'
  FFMPEG_SHA256_LINUX64: 'b4f4b357683462fbdbeaadf98ada904afe80c725d3ce8c0e1e84f75d1bb2108c'
  FFMPEG_SHA256_LINUXARM64: '10d3a2683f7d5b25aab903ce316ef4c627995108bf90cf8418f0ec9eae1d1213'
  FFMPEG_SHA256_WIN64: '11891c37401d1f8322a83effc48be2154bf4ad63a2ec7f28f43a74374c6176e7'

jobs:
  docker:
    if: inputs.docker
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            dockerfile: docker/Dockerfile
            arch: amd64
            runner: ubuntu-latest
          - variant: cpu
            dockerfile: docker/Dockerfile
            arch: arm64
            runner: ubuntu-24.04-arm
          - variant: cuda
            dockerfile: docker/Dockerfile.cuda
            arch: amd64
            runner: ubuntu-latest
          - variant: openvino
            dockerfile: docker/Dockerfile.openvino
            arch: amd64
            runner: ubuntu-latest
          - variant: lite
            dockerfile: docker/Dockerfile.lite
            arch: amd64
            runner: ubuntu-latest
          - variant: lite
            dockerfile: docker/Dockerfile.lite
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Lowercase image name
        id: img
        run: echo "NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build ${{ matrix.variant }} ${{ matrix.arch }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          load: ${{ matrix.variant != 'cuda' }}
          tags: smoke-test

      - name: Smoke test ${{ matrix.arch }}
        if: matrix.variant != 'cuda'
        run: |
          docker run --rm --entrypoint /usr/local/bin/monbooru smoke-test \
            -hash-password smoke-test

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ${{ matrix.variant }} ${{ matrix.arch }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ steps.img.outputs.NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 7

  manifest:
    if: inputs.docker && inputs.image_tags != ''
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            suffix: ""
          - variant: cuda
            suffix: "-cuda"
          - variant: openvino
            suffix: "-openvino"
          - variant: lite
            suffix: "-lite"
    steps:
      - name: Lowercase image name
        id: img
        run: echo "NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag ${{ matrix.variant }}
        working-directory: /tmp/digests
        run: |
          tags=""
          for t in ${{ inputs.image_tags }}; do
            tags="$tags --tag ghcr.io/${{ steps.img.outputs.NAME }}:${t}${{ matrix.suffix }}"
          done
          docker buildx imagetools create $tags \
            $(printf 'ghcr.io/${{ steps.img.outputs.NAME }}@sha256:%s ' *)

      - name: Login to GHCR (legacy namespace)
        id: legacy
        if: inputs.legacy && github.repository == 'monbooru/monbooru'
        continue-on-error: true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: leqwin
          password: ${{ secrets.GHCR_LEGACY_TOKEN }}

      - name: The legacy namespace login failed
        if: steps.legacy.outcome == 'failure'
        run: echo "::warning::The login to the legacy namespace failed (GHCR_LEGACY_TOKEN expired?); ghcr.io/leqwin/monbooru keeps its old tags."

      - name: Push ${{ matrix.variant }} to legacy namespace
        if: steps.legacy.outcome == 'success'
        run: |
          set -- ${{ inputs.image_tags }}
          tags=""
          for t in "$@"; do
            tags="$tags --tag ghcr.io/leqwin/monbooru:${t}${{ matrix.suffix }}"
          done
          docker buildx imagetools create $tags \
            ghcr.io/${{ steps.img.outputs.NAME }}:${1}${{ matrix.suffix }} \
            || echo "::warning::The push to the legacy namespace failed; ghcr.io/leqwin/monbooru keeps its old tags."

  binaries:
    name: Binaries ${{ matrix.os }} ${{ matrix.arch }}
    if: inputs.binaries
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64, runner: ubuntu-latest}
          - {os: linux, arch: arm64, runner: ubuntu-24.04-arm}
          - {os: windows, arch: amd64, runner: ubuntu-latest}
    env:
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip zip
          host=amd64
          sha=$GO_SHA256_LINUX_AMD64
          if [ "${{ matrix.runner }}" = ubuntu-24.04-arm ]; then
            host=arm64
            sha=$GO_SHA256_LINUX_ARM64
          fi
          ./packaging/install-go.sh "${GO_VERSION}" "$sha" "$host"

      - name: Fetch the bundled tools
        run: ./packaging/fetch-tools.sh

      - name: Build the lite and bundled archives
        run: |
          ./packaging/build-binaries.sh lite
          ./packaging/build-binaries.sh bundled

      - name: Build the installers
        if: matrix.os == 'windows'
        run: |
          ./packaging/build-installer.sh lite
          ./packaging/build-installer.sh bundled

      - name: Build the AppImage
        if: matrix.os == 'linux'
        run: ./packaging/build-appimage.sh

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  flatpak:
    name: Flatpak bundle
    if: inputs.binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder

      - name: Let bwrap open a user namespace
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build the bundle
        run: ./packaging/flatpak-bundle.sh

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: binaries-flatpak
          path: dist/*
          if-no-files-found: error
