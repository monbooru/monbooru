name: Test

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to test; empty tests the branch above
        required: false
      build:
        description: With a pull request, build its images as :pr-<n> and :pr-<n>-<sha> once the tests pass
        type: boolean
        default: false
      variants:
        description: The image variants to build, space-separated, among cpu cuda openvino lite; empty builds all
        required: false

permissions: {}

jobs:
  target:
    name: The commit to test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       (startsWith(github.event.comment.body, '/test') || startsWith(github.event.comment.body, '/build')) &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      statuses: write
    outputs:
      sha: ${{ steps.target.outputs.SHA }}
      build: ${{ steps.target.outputs.BUILD }}
      tags: ${{ steps.target.outputs.TAGS }}
      variants: ${{ steps.target.outputs.VARIANTS }}
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.issue.number || inputs.pr }}
      BUILD: ${{ inputs.build }}
      VARIANTS: ${{ inputs.variants }}
      KNOWN: cpu cuda openvino lite
      BODY: ${{ github.event.comment.body }}
      COMMENT_ID: ${{ github.event.comment.id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Resolve the commit
        id: target
        run: |
          case "$PR" in
            *[!0-9]*)
              echo "::error::Not a pull request number: $PR"
              exit 1 ;;
          esac
          set -f
          want=""
          build="$BUILD"
          args="$VARIANTS"
          refuse() {
            if [ "$GITHUB_EVENT_NAME" = issue_comment ]; then
              gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=-1 > /dev/null
            fi
            echo "::error::$1"
            exit 1
          }
          if [ "$GITHUB_EVENT_NAME" = issue_comment ]; then
            body="${BODY//$'\r'/}"
            body="${body#"${body%%[![:space:]]*}"}"
            body="${body%"${body##*[![:space:]]}"}"
            if [[ ! "$body" =~ ^/(test|build)(([[:blank:]]+[^[:space:]]+)*)$ ]]; then
              echo "Not a /test or /build command; nothing to do."
              exit 0
            fi
            [ "${BASH_REMATCH[1]}" = build ] && build=true || build=false
            args="${BASH_REMATCH[2],,}"
          fi
          asked=""
          for word in $args; do
            if [[ " $KNOWN " = *" $word "* ]] && [ "$build" = true ]; then
              asked="$asked $word"
            elif [ "$GITHUB_EVENT_NAME" = issue_comment ] && [ -z "$want" ] && [[ "$word" =~ ^[0-9a-f]{7,40}$ ]]; then
              want="$word"
            else
              refuse "/test takes nothing, or the head commit of the pull request as 7 to 40 hex digits; /build also takes image variants among: $KNOWN. Not understood: $word"
            fi
          done
          variants=""
          for word in $KNOWN; do
            [[ " $asked " = *" $word "* ]] && variants="$variants $word"
          done
          variants="${variants# }"
          if [ -n "$PR" ]; then
            sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)
            echo "testing pull request #$PR at $sha"
          else
            sha="$GITHUB_SHA"
            echo "testing $GITHUB_REF_NAME at $sha"
          fi
          if [ -n "$want" ] && [ "${sha#"$want"}" = "$sha" ]; then
            refuse "$want is not the head of pull request #$PR, which is now at ${sha:0:7}; nothing tested."
          fi
          if [ "$build" = true ]; then
            if [ -z "$PR" ]; then
              echo "::error::The images are built for a pull request; give its number."
              exit 1
            fi
            echo "BUILD=true" >> "$GITHUB_OUTPUT"
            echo "TAGS=pr-$PR pr-$PR-${sha:0:7}" >> "$GITHUB_OUTPUT"
            echo "VARIANTS=$variants" >> "$GITHUB_OUTPUT"
          fi
          echo "SHA=$sha" >> "$GITHUB_OUTPUT"

      - name: Acknowledge the comment
        if: github.event_name == 'issue_comment' && steps.target.outputs.SHA != ''
        run: gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=rocket > /dev/null

      - name: Mark the commit pending
        if: steps.target.outputs.SHA != ''
        env:
          SHA: ${{ steps.target.outputs.SHA }}
          IMAGES: ${{ steps.target.outputs.BUILD }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending -f context=test -f description="Tests running on ${SHA:0:7}" -f target_url="$RUN_URL" > /dev/null
          if [ "$IMAGES" = true ]; then
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending -f context=build -f description="Images wait for the tests on ${SHA:0:7}" -f target_url="$RUN_URL" > /dev/null
          fi

  race:
    name: Tests
    needs: target
    if: needs.target.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - name: Install ffmpeg
        run: sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Test
        run: go test -race -timeout 30m ./...

  tray:
    name: Linux tray
    needs: target
    if: needs.target.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - name: Build the Linux tray
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libgtk-3-dev libayatana-appindicator3-dev
          make build-tray

  test:
    name: Status on the commit
    needs: [target, race, tray]
    if: always() && needs.target.result == 'success' && needs.target.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.target.outputs.sha }}
      RESULTS: ${{ join(needs.*.result, ' ') }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Every part passed
        run: |
          state=success
          description="Tests passed on ${SHA:0:7}"
          case "$RESULTS" in
            *failure*|*cancelled*|*skipped*)
              state=failure
              description="Tests failed on ${SHA:0:7}: $RESULTS" ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context=test -f description="$description" -f target_url="$RUN_URL" > /dev/null
          [ "$state" = success ] || { echo "::error::$description"; exit 1; }

  images:
    name: Images
    needs: [target, test]
    if: needs.target.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.target.outputs.sha }}
      image_tags: ${{ needs.target.outputs.tags }}
      variants: ${{ needs.target.outputs.variants }}
      binaries: false
      legacy: false

  built:
    name: Build status on the commit
    needs: [target, test, images]
    if: always() && needs.target.result == 'success' && needs.target.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.target.outputs.sha }}
      TAGS: ${{ needs.target.outputs.tags }}
      VARIANTS: ${{ needs.target.outputs.variants }}
      RESULT: ${{ needs.images.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: The images are pushed
        run: |
          set -- $TAGS
          case "$RESULT" in
            success)
              state=success
              description="Pushed ghcr.io/${GITHUB_REPOSITORY,,}:$1 and :$2"
              case "$VARIANTS" in
                "") ;;
                cpu) description="$description, cpu only" ;;
                *" "*) description="$description, $VARIANTS only, each with its suffix" ;;
                *) description="Pushed ghcr.io/${GITHUB_REPOSITORY,,}:$1-$VARIANTS and :$2-$VARIANTS, $VARIANTS only" ;;
              esac ;;
            skipped)
              state=failure
              description="No images: the tests failed on ${SHA:0:7}" ;;
            *)
              state=failure
              description="The images failed on ${SHA:0:7}: $RESULT" ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context=build -f description="$description" -f target_url="$RUN_URL" > /dev/null
          [ "$state" = success ] || { echo "::error::$description"; exit 1; }
