{{define "partials/search_input.html"}}
<div class="search-input-wrap">
  <input type="text" name="q" id="search-input" value="{{.}}" placeholder="Search tags… (type system: for filters)" autocomplete="off"
         hx-get="/internal/search/suggest"
         hx-trigger="input changed delay:200ms"
         hx-target="#search-suggest"
         hx-push-url="false"
         hx-include="this"
         onkeydown="handleSuggestKey(event, 'search-suggest', 'search-input')">
  <div id="search-suggest" class="suggest-dropdown search-suggest-dropdown"></div>
</div>
{{end}}
