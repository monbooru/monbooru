{{define "partials/tag_rename_dialog.html"}}
<dialog id="rename-dialog">
  <form id="rename-form"
        hx-post=""
        hx-target="#rename-error">
    <p class="dlg-title">Rename <strong id="rename-src-name"></strong>{{template "webui/dialog_x"}}</p>
    <div class="field">
      <label>New name</label>
      <input type="text" name="name" id="rename-new-name" required autocomplete="off">
    </div>
    {{if .KeepAlias}}
    <div id="rename-keep-alias-row">
      <label style="display:block;font-size:12px">
        <input type="checkbox" name="keep_alias" value="1" id="rename-keep-alias">
        Keep the old name as an alias
      </label>
      <span class="field-hint">Without it, saved searches naming the old spelling match nothing.</span>
    </div>
    {{end}}
    <div id="rename-error"></div>
    {{template "dialog_actions" dict "ID" "rename-dialog" "Submit" "Rename"}}
  </form>
</dialog>
{{end}}
