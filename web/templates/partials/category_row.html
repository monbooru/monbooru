{{define "partials/category_row.html"}}
<tr id="cat-row-{{.ID}}" data-id="{{.ID}}" hx-target="this" hx-swap="outerHTML">
  <td class="cat-grip"><button type="button" class="cat-grip-btn" aria-label="Move {{.Name}}" title="Drag to reorder, or press &uarr; / &darr;">&equiv;</button></td>
  <td><span style="color:{{catColor .Color}}">{{.Name}}</span>{{if .IsBuiltin}} <span class="field-hint">(built-in)</span>{{end}}</td>
  <td>
    <span class="cat-color-pair">
      <input type="color" id="cat-swatch-{{.ID}}" name="color" value="{{.Color}}"
             class="cat-swatch" aria-label="Color for {{.Name}}"
             hx-patch="/settings/categories/{{.ID}}" hx-trigger="change">
      <input type="text" id="cat-hex-{{.ID}}" name="color" value="{{.Color}}"
             class="cat-hex mono-small" style="color:{{catColor .Color}}"
             list="cat-palette" pattern="#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})" maxlength="7" required
             spellcheck="false" autocomplete="off" aria-label="Hex color for {{.Name}}"
             hx-patch="/settings/categories/{{.ID}}" hx-trigger="change" hx-validate="true">
    </span>
  </td>
  <td>
    <div class="cat-actions">
      {{if ne .Name "rating"}}
      <button type="button" class="btn-sm btn-cat-cleanup" data-id="{{.ID}}" data-name="{{.Name}}">Clean up…</button>
      {{else}}
      <button class="btn-sm cat-action-spacer" tabindex="-1" aria-hidden="true">Clean up…</button>
      {{end}}
      {{$default := catDefault .Name}}
      {{if and $default (ne .Color $default)}}
      <button type="button" class="btn-sm btn-cat-reset"
              hx-patch="/settings/categories/{{.ID}}"
              hx-vals='{"color":"{{$default}}"}'>Reset</button>
      {{else}}
      <button class="btn-sm cat-action-spacer" tabindex="-1" aria-hidden="true">Reset</button>
      {{end}}
      {{if not .IsBuiltin}}
      <button class="btn-sm btn-cat-rename-trigger"
              data-id="{{.ID}}" data-name="{{.Name}}">Rename</button>
      {{else}}
      <button class="btn-sm cat-action-spacer" tabindex="-1" aria-hidden="true">Rename</button>
      {{end}}
      {{if not .IsBuiltin}}
      <button class="btn-sm btn-danger btn-delete-category"
              data-id="{{.ID}}" data-name="{{.Name}}">Delete</button>
      {{end}}
    </div>
  </td>
</tr>
{{end}}
