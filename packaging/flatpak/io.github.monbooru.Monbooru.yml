app-id: io.github.monbooru.Monbooru
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: monbooru-run

finish-args:
  - --share=network
  - --filesystem=home
  - --filesystem=/mnt
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=xdg-config/autostart:create

modules:
  - name: monworker
    buildsystem: simple
    build-commands:
      - install -Dm755 monworker /app/bin/monworker
      - install -Dm644 libonnxruntime.so /app/bin/libonnxruntime.so
      - install -Dm644 -t /app/share/licenses/monworker LICENSE
      - install -Dm644 -t /app/share/licenses/onnxruntime licenses/onnxruntime/*
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/monbooru/monworker/releases/download/v1.0.2/monworker_1.0.2_linux_amd64.tar.gz
        sha256: 473520805cf5f28bea3883cbe9d2d5749fe2612d69299942162ee3cd5a291200
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/monbooru/monworker/releases/download/v1.0.2/monworker_1.0.2_linux_arm64.tar.gz
        sha256: e3623311399b897c5ef1a7d74b8ab088ac3c0f6bfb0d80757d6a50d5421a3e17

  - name: ffmpeg
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/ffmpeg /app/bin/ffmpeg
      - install -Dm755 bin/ffprobe /app/bin/ffprobe
      - install -Dm644 -t /app/share/licenses/ffmpeg licenses/*
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/monbooru/ffmpeg-builds/releases/download/v8.1.3-mb4/ffmpeg-8.1.3-mb4-linux64.tar.xz
        sha256: b4f4b357683462fbdbeaadf98ada904afe80c725d3ce8c0e1e84f75d1bb2108c
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/monbooru/ffmpeg-builds/releases/download/v8.1.3-mb4/ffmpeg-8.1.3-mb4-linuxarm64.tar.xz
        sha256: 10d3a2683f7d5b25aab903ce316ef4c627995108bf90cf8418f0ec9eae1d1213

  - name: monbooru
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/golang/bin
      build-args:
        - --share=network
    build-commands:
      - |
        set -eu
        export GOTOOLCHAIN=go$(awk '/^go /{print $2; exit}' go.mod)
        . ./packaging/release-env.sh
        CGO_ENABLED=0 go build \
          -ldflags="-s -w $LDFLAGS -X '$MOD.Package=flatpak'" \
          -o monbooru ./cmd/monbooru
        sh packaging/metainfo.sh io.github.monbooru.Monbooru.desktop > metainfo.xml
      - install -Dm755 monbooru /app/bin/monbooru
      - install -Dm755 packaging/flatpak/monbooru-run /app/bin/monbooru-run
      - install -Dm644 packaging/flatpak/io.github.monbooru.Monbooru.desktop /app/share/applications/io.github.monbooru.Monbooru.desktop
      - install -Dm644 metainfo.xml /app/share/metainfo/io.github.monbooru.Monbooru.metainfo.xml
      - install -Dm644 packaging/icons/monbooru-64.png /app/share/icons/hicolor/64x64/apps/io.github.monbooru.Monbooru.png
      - install -Dm644 packaging/icons/monbooru-128.png /app/share/icons/hicolor/128x128/apps/io.github.monbooru.Monbooru.png
      - install -Dm644 packaging/icons/monbooru-256.png /app/share/icons/hicolor/256x256/apps/io.github.monbooru.Monbooru.png
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - monbooru
          - perf
          - dist
          - stage
          - tools
          - worker
          - test-results
